 es.forEach((e,i)=>{[...e.lines.filter(l=>l.dr),...e.lines.filter(l=>l.cr)].forEach((l,j)=>{d+=l.dr;c+=l.cr;body+=rw([j?E0:dc(i,e.d),td((l.cr?'<span class="ind"></span>':'')+A[l.a]+(l.n?' – '+l.n:'')),td(l.a+(l.n?'/✓':''),'c'),am(l.dr),am(l.cr)])});
  body+=rw([E0,td('<span class="ind"></span>'+e.desc),E0,E0,E0,E0,E0])});
 if(es.length)body+=rw([E0,td('รวม'),E0,am(d),am(c)],'t')}

 if(k=='CP')b=dy+I('rf','เลขที่ใบสำคัญ','text')+I('ds','คำอธิบาย','text')+I('d4','เครดิต เงินสด')+I('d5','เครดิต เงินฝากธนาคาร')+I('d6','เครดิต ส่วนลดรับ')+I('cn','เจ้าหนี้ ชื่อ','text','list="dl21"')+I('c1','เดบิต เจ้าหนี้')+I('pc','เดบิต ซื้อ')+`<div><label>เดบิต บัญชีอื่น</label><select id="oa">${OP([13,21])}</select></div>`+I('c2','จำนวนบัญชีอื่น');
 if(k=='G'){gN=2;b=dy+I('ds','คำอธิบาย','text')+`</div><div id="gl">${gr(0)+gr(1)}</div><div class="bar" style="margin-top:6px"><button type="button" class="o" id="ga">+ เพิ่มบรรทัด</button>`}
 return`${nm(13)}${nm(21)}<form id="fm" data-k="${k}"><b>บันทึกรายการใน${B[k]}</b><div class="g" style="margin-top:6px">${b}</div><div class="bar" style="margin-top:8px"><button>บันทึกและผ่านรายการ</button></div></form>`}
const gr=i=>`<div class="g" style="margin-top:6px"><div><label>บัญชี</label><select id="ga${i}">${OP([])}</select></div>${I('gn'+i,'ชื่อ (13/21)','text')}${I('gd'+i,'เดบิต')}${I('gc'+i,'เครดิต')}</div>`;
const v=id=>+($('#'+id)&&$('#'+id).value)||0,s=id=>($('#'+id)&&$('#'+id).value||'').trim();
function save(k){const d=v('d');let ls=[],ref='',t='',desc=s('ds');
 if(k=='S'||k=='P'){const n=s('nm'),m=v('am');ref=s('ref');t=s('tm');desc=n;ls=k=='S'?[[13,m,0,n],[41,0,m]]:[[51,m],[21,0,m,n]]}
 if(k=='CR')ref=s('rf'),ls=[[11,v('c1')],[12,v('c2')],[43,v('c3')],[13,0,v('d4'),s('dn')],[41,0,v('d5')],[+s('oa')||0,0,v('d6')]];
 if(k=='CP')ref=s('rf'),ls=[[21,v('c1'),0,s('cn')],[51,v('pc')],[+s('oa')||0,v('c2')],[11,0,v('d4')],[12,0,v('d5')],[54,0,v('d6')]];
 if(k=='G')for(let i=0;i<gN;i++)ls.push([+s('ga'+i)||0,v('gd'+i),v('gc'+i),s('gn'+i)]);
 ls=L(ls).filter(l=>l.dr||l.cr);
 const dr=R(ls.reduce((x,l)=>x+l.dr,0)),cr=R(ls.reduce((x,l)=>x+l.cr,0));
 if(!(d>=1&&d<=31))return'กรอกวันที่ 1–31';
 if(!ls.length)return'ยังไม่ได้กรอกจำนวนเงิน';
 if(ls.some(l=>!l.a))return'มีจำนวนเงินแต่ยังไม่ได้เลือกบัญชี';
 if(dr!=cr)return`ไม่บันทึก: ยอดเดบิต ${f(dr)} ไม่เท่ากับยอดเครดิต ${f(cr)} (ต่างกัน ${f(Math.abs(R(dr-cr)))})`;
 if(ls.some(l=>(l.a==13||l.a==21)&&!l.n))return'บัญชีลูกหนี้/เจ้าหนี้ต้องระบุชื่อ เพื่อผ่านรายการไปบัญชีย่อย';
 E.push({b:k,d,desc,ref,t,lines:ls});return null}
function led(){const m=post();let h='<h2>บัญชีแยกประเภททั่วไป</h2>';
 Object.keys(A).forEach(a=>{const p=m.filter(x=>x.a==a);if(!p.length)return;let r=0;
  h+=`<h3>${a} ${A[a]}${a==13||a==21?' <small>(บัญชีคุม)</small>':''}</h3>`+W(th(['วันที่','รายการ','สมุด','เดบิต','เครดิต','คงเหลือ'])+p.map(x=>{r=R(r+(DN(+a)?x.dr-x.cr:x.cr-x.dr));return tr([dt(x.d),x.desc,C(BS[x.b]),N(x.dr),N(x.cr),N(r)])}).join(''))});
 [13,21].forEach(a=>{const S=subs(a);h+=`<h2>บัญชีแยกประเภทย่อย${a==13?'ลูกหนี้การค้า':'เจ้าหนี้การค้า'}</h2>`;let tot=0;
  for(const n in S){let r=0;h+=`<h3>${n}</h3>`+W(th(['วันที่','รายการ','สมุด','เดบิต','เครดิต','คงเหลือ'])+S[n].map(x=>{r=R(r+(a==13?x.dr-x.cr:x.cr-x.dr));return tr([dt(x.d),x.desc,C(BS[x.b]),N(x.dr),N(x.cr),N(r)])}).join(''));tot+=r}
  const ct=bal()[a]?R(a==13?bal()[a].dr-bal()[a].cr:bal()[a].cr-bal()[a].dr):0;
  h+=`<div class="box ${R(tot)==ct?'ok':'bad'}">ยอดรวมบัญชีย่อย ${f(R(tot))} ${R(tot)==ct?'=':'≠'} ยอดบัญชีคุม ${f(ct)} บาท</div>`});
 return E.length?h:'<div class="box">ยังไม่มีรายการ</div>'}
function tb(){const m=bal();let d=0,c=0,rows='';
 Object.keys(A).forEach(a=>{if(!m[a])return;const x=R(m[a].dr-m[a].cr);x>0?d+=x:c-=x;rows+=tr([C(a),A[a],N(x>0?x:0),N(x<0?-x:0)])});
 d=R(d);c=R(c);const ok=d==c;
 return`<h2>งบทดลอง ณ วันที่ 31 สิงหาคม 2563</h2><div class="box ${ok?'ok':'bad'}">${E.length?ok?`✓ งบทดลองสมดุล: เดบิต ${f(d)} = เครดิต ${f(c)}`:`⚠ งบทดลองไม่สมดุล: เดบิต ${f(d)} ≠ เครดิต ${f(c)} (ต่างกัน ${f(Math.abs(R(d-c)))})`:'ยังไม่มีรายการ'}</div>`+W(th(['เลขที่','ชื่อบัญชี','เดบิต','เครดิต'])+rows+tr(['','รวม',N(d),N(c)],'t'))}
function coa(){let h='<h2>ผังบัญชี (Chart of Accounts)</h2>'+W(th(['เลขที่','ชื่อบัญชี','หมวด','ด้านปกติ'])+Object.keys(A).map(a=>tr([C(a),A[a],TY[a[0]],C(DN(+a)?'เดบิต':'เครดิต')])).join(''));
 return h+`<div class="box">บัญชี 14 สินค้าคงเหลือ ใช้ในการปิดบัญชีสิ้นงวด (ระบบ Periodic จึงไม่มียอดระหว่างเดือน) · บัญชี 13 และ 21 เป็นบัญชีคุม มีบัญชีย่อยรายตัว · 15, 52 ไม่มีรายการในเดือนนี้</div>
<h3>วิธีใช้</h3><small>เลือกแท็บสมุดแต่ละเล่ม → กรอกฟอร์ม → กด “บันทึกและผ่านรายการ” ระบบจะผ่านรายการไปบัญชีแยกประเภททั่วไปและบัญชีย่อยอัตโนมัติ และตรวจว่าเดบิต = เครดิตก่อนบันทึกทุกครั้ง ดูผลที่แท็บ “แยกประเภท” และ “งบทดลอง”</small>`}
